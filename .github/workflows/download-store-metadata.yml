name: Download Store Metadata

# Download current store listings (metadata + screenshots) from the live stores
# into the fastlane directories in the repo, then commit the result.
# Run this once to bootstrap or refresh the local metadata from what is actually
# live in the stores before editing locally and uploading via publish-metadata.
#
# Defaults to every app in storeApps (flutter/release/release_config.json) on
# every store. The live listing is authoritative: files present in the repo but
# not returned by the store are pruned, so the download REPLACES the stored
# metadata instead of merging into it. GrowERP-authored files the stores never
# return (screenshot caption .strings, iOS review_information) are preserved —
# see prune_to_download in commit-metadata.
#

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "'all' (every app in storeApps in
          flutter/release/release_config.json) or comma-separated app names"
        required: true
        default: "all"
        type: string
      stores:
        description: "'all' or comma-separated: ios, macos, android, windows"
        required: true
        default: "all"
        type: string

concurrency:
  group: store-metadata-download
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Convert comma-separated inputs into JSON arrays for downstream matrix jobs.
  # Inline job (not reusable workflow) so IDE tooling can validate outputs.
  # ───────────────────────────────────────────────────────────────────────────
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.matrix.outputs.apps }}
      stores: ${{ steps.matrix.outputs.stores }}
      run_android: ${{ steps.matrix.outputs.run_android }}
      run_ios: ${{ steps.matrix.outputs.run_ios }}
      run_macos: ${{ steps.matrix.outputs.run_macos }}
      run_windows: ${{ steps.matrix.outputs.run_windows }}
      android_matrix: ${{ steps.matrix.outputs.android_matrix }}
      ios_matrix: ${{ steps.matrix.outputs.ios_matrix }}
      macos_matrix: ${{ steps.matrix.outputs.macos_matrix }}
      windows_matrix: ${{ steps.matrix.outputs.windows_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: flutter/release/release_config.json
          sparse-checkout-cone-mode: false
      - id: matrix
        env:
          APPS: ${{ inputs.apps }}
          STORES: ${{ inputs.stores }}
        run: |
          # Central app list: storeApps in flutter/release/release_config.json
          VALID_APPS=$(jq -r '.storeApps | keys_unsorted | join(" ")' flutter/release/release_config.json)

          # 'all' keeps the app list in release_config.json only — a new vertical
          # needs no workflow edit. Same sentinel as screenshots.yml.
          # if/fi, not `[[ ]] && x`: steps run under `bash -e`, where a trailing
          # false test would abort the step.
          if [[ "$APPS" == "all" ]]; then
            APPS=$(jq -r '.storeApps | keys_unsorted | join(",")' flutter/release/release_config.json)
          fi
          if [[ "$STORES" == "all" ]]; then
            STORES="android,ios,macos,windows"
          fi
          echo "Resolved apps:   $APPS"
          echo "Resolved stores: $STORES"
          echo "apps=${APPS}"     >> "$GITHUB_OUTPUT"
          echo "stores=${STORES}" >> "$GITHUB_OUTPUT"

          IFS=',' read -ra app_list <<< "$APPS"
          for app in "${app_list[@]}"; do
            app=$(echo "$app" | tr -d ' ')
            if ! echo "$VALID_APPS" | grep -qw "$app"; then
              echo "Invalid app: '$app'. Valid values: $VALID_APPS" >&2
              exit 1
            fi
          done

          # Only include apps published on the given store
          build_matrix() {
            local store_apps="$1"
            local json="["
            local first=true
            IFS=',' read -ra app_list <<< "$APPS"
            for app in "${app_list[@]}"; do
              app=$(echo "$app" | tr -d ' ')
              if echo "$store_apps" | grep -qw "$app"; then
                if [[ "$first" == "false" ]]; then json="$json,"; fi
                # secretSuffix backs dynamic per-app secret lookup, e.g.
                # WINDOWS_<SUFFIX>_PRODUCT_ID in download-windows.
                json="${json}{\"app\":\"${app}\",\"secretSuffix\":\"${app^^}\"}"
                first=false
              fi
            done
            json="${json}]"
            echo "$json"
          }

          contains() { echo "$STORES" | grep -qw "$1"; }

          for store in ios macos android windows; do
            store_apps=$(jq -r --arg s "$store" \
              '[.storeApps | to_entries[] | select(.value | index($s)) | .key] | join(" ")' \
              flutter/release/release_config.json)
            matrix=$(build_matrix "$store_apps")
            if contains "$store" && [[ "$matrix" != "[]" ]]; then
              echo "run_${store}=true"          >> "$GITHUB_OUTPUT"
              echo "${store}_matrix=${matrix}"  >> "$GITHUB_OUTPUT"
            else
              echo "run_${store}=false"         >> "$GITHUB_OUTPUT"
              echo "${store}_matrix=[]"         >> "$GITHUB_OUTPUT"
            fi
          done

  # ───────────────────────────────────────────────────────────────────────────
  # Android — download metadata from Google Play into android/fastlane/metadata/
  # Secrets: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
  # ───────────────────────────────────────────────────────────────────────────
  download-android:
    needs: [ resolve-matrix ]
    if: needs.resolve-matrix.outputs.run_android == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.android_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: flutter/packages/${{ matrix.app }}/android/fastlane

      - name: Download Android metadata from Google Play
        env:
          GOOGLE_PLAY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          BUNDLE_GEMFILE: fastlane/Gemfile
        run: |
          set -euo pipefail
          # The Appfiles read SUPPLY_JSON_KEY_FILE / SUPPLY_JSON_KEY_DATA, not
          # GOOGLE_PLAY_JSON_KEY_DATA, so materialise the secret to a file the
          # same way publish-metadata.yml does.
          export KEY_FILE="/tmp/gplay_key_${{ matrix.app }}.json"
          python3 - << 'PYEOF'
          import os, json
          raw = os.environ.get('GOOGLE_PLAY_JSON_KEY_DATA', '')
          start = raw.find('{')
          if start < 0:
              raise ValueError(f"No JSON object found in secret (first 4 chars: {repr(raw[:4])})")
          content = raw[start:]
          json.loads(content)  # validate before writing
          open(os.environ['KEY_FILE'], 'w').write(content)
          PYEOF
          # Central package name list: androidIds in release_config.json
          PACKAGE_NAME=$(jq -r --arg a "${{ matrix.app }}" \
            '.androidIds[$a] // ("org.growerp." + $a)' ../../../release/release_config.json)
          echo "Downloading listing for $PACKAGE_NAME"
          SUPPLY_JSON_KEY_FILE="$KEY_FILE" bundle exec fastlane run download_from_play_store \
            package_name:"$PACKAGE_NAME" \
            metadata_path:"fastlane/metadata/android"
          rm -f "$KEY_FILE"
        working-directory: flutter/packages/${{ matrix.app }}/android

      - name: Upload downloaded Android metadata
        uses: actions/upload-artifact@v4
        with:
          # Only the supply-owned tree — the sibling metadata/framed/ preview dir
          # is generated by screenshots.yml and must survive the round trip.
          # upload-artifact roots the archive at the least common ancestor of the
          # given paths, so a SINGLE directory path means the artifact contains
          # that directory's contents (en-US/...) at its root. commit-metadata
          # relies on that; never add a second path here.
          name: android-metadata-${{ matrix.app }}
          path: flutter/packages/${{ matrix.app }}/android/fastlane/metadata/android/
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # iOS — download metadata + screenshots from App Store Connect
  # Secrets: APP_STORE_CONNECT_API_KEY_ID/ISSUER_ID/KEY_CONTENT
  # ───────────────────────────────────────────────────────────────────────────
  download-ios:
    needs: [ resolve-matrix ]
    if: needs.resolve-matrix.outputs.run_ios == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.ios_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: flutter/fastlane

      - name: Create App Store Connect API key file
        id: asc-key
        uses: ./.github/actions/setup-asc-key
        with:
          asc_key_content: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          asc_key_id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          asc_issuer_id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

      - name: Download iOS metadata from App Store Connect
        env:
          APP_NAME: ${{ matrix.app }}
          BUNDLE_GEMFILE: fastlane/Gemfile
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          APP_NAME="${{ matrix.app }}"
          METADATA_PATH="$(pwd)/packages/${APP_NAME}/ios/fastlane/metadata"
          SCREENSHOTS_PATH="$(pwd)/packages/${APP_NAME}/ios/fastlane/screenshots"
          mkdir -p "$METADATA_PATH" "$SCREENSHOTS_PATH"

          API_KEY_FILE="${{ steps.asc-key.outputs.api_key_path }}"

          # --force is mandatory here. deliver's download_metadata calls
          # force_overwrite_metadata?, which asks "Do you want to overwrite
          # existing metadata" only `if UI.interactive?` and then does
          # `return 0 unless res` — so on CI it exits 0 having downloaded
          # nothing at all. That silent no-op is why the repo copies never
          # changed. (use_live_version has no effect on this subcommand: it
          # always reads get_latest_app_store_version.)
          bundle exec fastlane deliver download_metadata \
            --api_key_path "$API_KEY_FILE" \
            --metadata_path "$METADATA_PATH" \
            --app_identifier "org.growerp.${APP_NAME}" \
            --force true

          bundle exec fastlane deliver download_screenshots \
            --api_key_path "$API_KEY_FILE" \
            --screenshots_path "$SCREENSHOTS_PATH" \
            --app_identifier "org.growerp.${APP_NAME}" \
            --use_live_version true

          rm -f "$API_KEY_FILE"

          if [ -z "$(find "$METADATA_PATH" -type f -print -quit)" ]; then
            echo "::warning::iOS ${APP_NAME}: deliver returned no metadata — nothing to commit"
          fi
        working-directory: flutter

      # Two separate artifacts, one directory each: with two paths in one
      # artifact the archive root would shift depending on whether the
      # screenshots dir came back empty.
      - name: Upload downloaded iOS metadata
        uses: actions/upload-artifact@v4
        with:
          name: ios-metadata-${{ matrix.app }}
          path: flutter/packages/${{ matrix.app }}/ios/fastlane/metadata/
          retention-days: 1

      - name: Upload downloaded iOS screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots-${{ matrix.app }}
          path: flutter/packages/${{ matrix.app }}/ios/fastlane/screenshots/
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # macOS — download metadata from Mac App Store
  # Secrets: APP_STORE_CONNECT_API_KEY_ID/ISSUER_ID/KEY_CONTENT
  # ───────────────────────────────────────────────────────────────────────────
  download-macos:
    needs: [ resolve-matrix ]
    if: needs.resolve-matrix.outputs.run_macos == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve macOS bundle ID
        env:
          MATRIX_APP: ${{ matrix.app }}
        run: |
          # Central app/bundle list: storeApps + bundleIds in release_config.json
          if ! jq -e --arg app "$MATRIX_APP" '.storeApps[$app] // [] | index("macos")' \
              flutter/release/release_config.json >/dev/null; then
            echo "Unsupported macOS app: $MATRIX_APP" >&2
            exit 1
          fi
          echo "BUNDLE_ID=$(jq -r --arg app "$MATRIX_APP" \
            '.bundleIds[$app] // ("org.growerp." + $app)' flutter/release/release_config.json)" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: flutter/fastlane

      - name: Create App Store Connect API key file
        id: asc-key
        uses: ./.github/actions/setup-asc-key
        with:
          asc_key_content: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          asc_key_id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          asc_issuer_id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

      - name: Download macOS metadata from Mac App Store
        env:
          APP_NAME: ${{ matrix.app }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          BUNDLE_GEMFILE: fastlane/Gemfile
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          APP_NAME="${{ matrix.app }}"
          METADATA_PATH="$(pwd)/packages/${APP_NAME}/macos/fastlane/metadata"
          mkdir -p "$METADATA_PATH"

          API_KEY_FILE="${{ steps.asc-key.outputs.api_key_path }}"

          # --force: see the iOS job — without it deliver returns 0 without
          # downloading anything whenever it cannot prompt interactively.
          bundle exec fastlane deliver download_metadata \
            --api_key_path "$API_KEY_FILE" \
            --metadata_path "$METADATA_PATH" \
            --app_identifier "$BUNDLE_ID" \
            --platform osx \
            --force true

          rm -f "$API_KEY_FILE"

          if [ -z "$(find "$METADATA_PATH" -type f -print -quit)" ]; then
            echo "::warning::macOS ${APP_NAME}: deliver returned no metadata — nothing to commit"
          fi
        working-directory: flutter

      - name: Upload downloaded macOS metadata
        uses: actions/upload-artifact@v4
        with:
          name: macos-metadata-${{ matrix.app }}
          path: flutter/packages/${{ matrix.app }}/macos/fastlane/metadata/
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # Windows — download metadata from Partner Center API
  # Secrets: WINDOWS_TENANT_ID, WINDOWS_CLIENT_ID, WINDOWS_CLIENT_SECRET,
  #          WINDOWS_<APP>_PRODUCT_ID per app
  # ───────────────────────────────────────────────────────────────────────────
  download-windows:
    needs: [ resolve-matrix ]
    if: needs.resolve-matrix.outputs.run_windows == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.windows_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows metadata from Partner Center
        env:
          WINDOWS_TENANT_ID: ${{ secrets.WINDOWS_TENANT_ID }}
          WINDOWS_CLIENT_ID: ${{ secrets.WINDOWS_CLIENT_ID }}
          WINDOWS_CLIENT_SECRET: ${{ secrets.WINDOWS_CLIENT_SECRET }}
          WINDOWS_PRODUCT_ID: ${{ secrets[format('WINDOWS_{0}_PRODUCT_ID', matrix.secretSuffix)] }}
          APP_NAME: ${{ matrix.app }}
        run: |
          python3 << 'PYEOF'
          import requests
          import json
          import os
          from pathlib import Path

          app_name = os.environ['APP_NAME']
          app_id = os.environ.get('WINDOWS_PRODUCT_ID', '')

          if not app_id:
              print(f'No product ID for {app_name}. Skipping.')
              exit(0)

          # Authenticate
          auth_data = {
              'grant_type': 'client_credentials',
              'client_id': os.environ['WINDOWS_CLIENT_ID'],
              'client_secret': os.environ['WINDOWS_CLIENT_SECRET'],
              'resource': 'https://manage.devcenter.microsoft.com',
          }
          auth_resp = requests.post(
              f"https://login.microsoftonline.com/{os.environ['WINDOWS_TENANT_ID']}/oauth2/token",
              data=auth_data
          )
          auth_resp.raise_for_status()
          token = auth_resp.json()['access_token']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/json'}

          # Get app details. raise_for_status, because an unchecked 4xx used to
          # yield {} here and the job then wrote four EMPTY files that now
          # overwrite the real listing in the repo.
          base_url = f'https://manage.devcenter.microsoft.com/v1.0/my/applications/{app_id}'
          app_resp = requests.get(base_url, headers=headers)
          app_resp.raise_for_status()
          app_data = app_resp.json()

          # Extract metadata from last published submission
          metadata = {}

          last_pub = app_data.get('lastPublishedApplicationSubmission', {})
          if last_pub:
              sub_resp = requests.get(f"{base_url}/submissions/{last_pub['id']}", headers=headers)
              sub_resp.raise_for_status()
              sub_data = sub_resp.json()

              # Extract store listing (usually first listing is en-US)
              listings = sub_data.get('listings', {})
              if listings:
                  first_listing = next(iter(listings.values()), {})
                  metadata = {
                      'description': first_listing.get('description', ''),
                      'short_description': first_listing.get('shortDescription', ''),
                      'release_notes': first_listing.get('releaseNotes', ''),
                      'keywords': first_listing.get('keywords', ''),
                  }

          # No published listing to mirror: write nothing at all. Writing empty
          # files here would wipe the repo copy, since the restore treats the
          # download as authoritative.
          if not any(metadata.values()):
              print(f'::warning::Windows {app_name}: no published listing returned '
                    '(no lastPublishedApplicationSubmission or empty listings) — '
                    'leaving the stored metadata untouched')
              exit(0)

          # Write to fastlane metadata dir
          metadata_dir = Path(f'flutter/packages/{app_name}/windows/fastlane/metadata/en-US')
          metadata_dir.mkdir(parents=True, exist_ok=True)

          for key, value in metadata.items():
              if not value:
                  # An individual empty field is a field the store does not have;
                  # do not blank the local one on its behalf.
                  print(f'Skipped {key}.txt (empty in the store listing)')
                  continue
              path = metadata_dir / f'{key}.txt'
              path.write_text(value)
              print(f'Saved {path}')

          print('Windows metadata downloaded successfully')
          PYEOF

      - name: Upload downloaded Windows metadata
        uses: actions/upload-artifact@v4
        with:
          name: windows-metadata-${{ matrix.app }}
          path: flutter/packages/${{ matrix.app }}/windows/fastlane/metadata/
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # Commit all downloaded metadata back to the repo.
  # The live listing is authoritative: each repo tree is pruned of files the
  # store did not return before the download is copied over it.
  # Runs on whatever artifacts exist rather than on job results — a matrix job
  # reports failure when ANY leg fails (e.g. an app not published yet), and
  # gating on that would discard every other app's successful download.
  # ───────────────────────────────────────────────────────────────────────────
  commit-metadata:
    needs: [ resolve-matrix, download-android, download-ios, download-macos, download-windows ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all metadata artifacts
        uses: actions/download-artifact@v4
        with:
          path: _downloads

      - name: Restore downloaded metadata over the repo copies
        env:
          APPS: ${{ needs.resolve-matrix.outputs.apps }}
        run: |
          set -euo pipefail

          # Store listing wins over what is stored in the repo: a file present
          # locally but absent from the download is stale and gets removed.
          # Kept regardless, because no store ever returns them:
          #   *.strings              screenshot captions read by screenshots.yml
          #   review_information/**  iOS demo account (deliver does not download it)
          #   screenshots/**         regenerated per publish from framed-screenshots
          #   README.txt             hand-written placeholders
          prune_to_download() {
            local src="$1" dst="$2"
            [ -d "$dst" ] || return 0
            while IFS= read -r rel; do
              case "$rel" in
                *.strings|*/review_information/*|*/screenshots/*|*README.txt) continue ;;
              esac
              if [ ! -f "$src/$rel" ]; then
                rm -f "$dst/$rel"
                echo "  pruned $rel"
              fi
            done < <(cd "$dst" && find . -type f)
            # -mindepth 1 so $dst itself is never removed when everything under
            # it was pruned — the cp below needs it to exist.
            find "$dst" -mindepth 1 -type d -empty -delete 2>/dev/null || true
          }

          # $1 = artifact name, $2 = repo dir, $3 = "noprune" to copy over the
          # repo copy without deleting what the download omitted.
          # Artifact roots hold the contents of the single directory each
          # download job uploaded.
          restore() {
            local src="_downloads/$1" dst="$2" mode="${3:-prune}"
            if [ ! -d "$src" ]; then
              echo "  (no artifact $1)"
              return 0
            fi
            mkdir -p "$dst"
            if [ "$mode" != "noprune" ]; then
              prune_to_download "$src" "$dst"
            fi
            cp -r "$src/." "$dst/"
            echo "  restored $1 -> $dst ($mode)"
          }

          IFS=',' read -ra app_list <<< "$APPS"
          for app in "${app_list[@]}"; do
            app=$(echo "$app" | tr -d ' ')
            echo "=== $app"
            restore "android-metadata-${app}"  "flutter/packages/${app}/android/fastlane/metadata/android"
            restore "ios-metadata-${app}"      "flutter/packages/${app}/ios/fastlane/metadata"
            restore "ios-screenshots-${app}"   "flutter/packages/${app}/ios/fastlane/screenshots"
            restore "macos-metadata-${app}"    "flutter/packages/${app}/macos/fastlane/metadata"
            # noprune: fastlane mirrors a store listing in full, but the Windows
            # job maps four hand-picked Partner Center fields and omits any that
            # come back empty. Pruning on that partial view would delete the
            # local copy of exactly those fields.
            restore "windows-metadata-${app}"  "flutter/packages/${app}/windows/fastlane/metadata" noprune
          done

      - name: Clean up artifact download directory
        run: rm -rf _downloads

      - name: Commit downloaded metadata
        env:
          APPS: ${{ needs.resolve-matrix.outputs.apps }}
          STORES: ${{ needs.resolve-matrix.outputs.stores }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          APPS=$(echo "$APPS" | tr -d ' ')
          STORES=$(echo "$STORES" | tr -d ' ')

          IFS=',' read -ra app_list <<< "$APPS"
          for app in "${app_list[@]}"; do
            for sub in android/fastlane/metadata \
                       ios/fastlane/metadata \
                       macos/fastlane/metadata \
                       windows/fastlane/metadata; do
              dir="flutter/packages/${app}/${sub}"
              # -A so pruned files are staged as deletions too. No 2>/dev/null:
              # a real add failure must not be swallowed. if/fi so a missing dir
              # on the last iteration does not fail the loop under `set -e`.
              if [ -d "$dir" ]; then git add -A "$dir"; fi
            done

            # iOS screenshots are gitignored (bare `screenshots` in
            # flutter/.gitignore) and `git add` errors when the pathspec names
            # an ignored path outright. Publishing regenerates them from the
            # screenshots.yml artifact, so the repo copies are not a source of
            # truth — -u keeps the handful of already-tracked files in sync and
            # never touches ignored untracked ones.
            # ls-files guard: `git add -u` exits 128 ("pathspec did not match any
            # file(s) known to git") when the directory exists but holds nothing
            # tracked — which is every app whose screenshots are only ignored
            # downloads.
            shots="flutter/packages/${app}/ios/fastlane/screenshots"
            if [ -d "$shots" ] && [ -n "$(git ls-files -- "$shots")" ]; then
              git add -u "$shots"
            fi
          done

          echo "=== git status ==="
          git status --short
          echo "==================="

          git diff --cached --quiet && { echo "Nothing to commit — metadata already up to date"; exit 0; }
          git commit -m "chore: download store metadata for apps=[$APPS] stores=[$STORES] [skip ci]"
          # The branch has usually moved on by now (screenshots.yml writes into the
          # same fastlane metadata trees), so a plain push is rejected. Rebase onto
          # whatever landed meanwhile and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Pushed store metadata"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto ${{ github.ref_name }}"
            git fetch origin ${{ github.ref_name }}
            if ! git rebase origin/${{ github.ref_name }}; then
              git rebase --abort || true
              echo "::error::Could not rebase downloaded metadata onto ${{ github.ref_name }}"
              exit 1
            fi
          done
          echo "::error::Failed to push store metadata after 3 attempts"
          exit 1
