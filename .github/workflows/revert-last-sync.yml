name: Revert Production Update

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps: all, or a comma list of admin,hotel,freelance,support,agents,rental,marketing,academy,insurance,moqui"
        required: true
        default: "all"
        type: string

concurrency:
  group: revert-last-sync
  cancel-in-progress: false

jobs:
  revert:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve services
        id: services
        env:
          APPS_INPUT: ${{ inputs.apps }}
        run: |
          # apps / stores inputs: "all" or a comma list (e.g. admin,hotel), case and spaces ignored.
          # Sets the ALL_*/APP_*/STORE_* flags the selection below works with.
          _sel() { echo "${1:-}" | tr 'A-Z' 'a-z' | tr -d ' '; }
          _flags() {  # <selection> <prefix> <ALL_ var> <valid names...>
            local sel="$1" prefix="$2" all="$3" name; shift 3
            printf -v "$all" '%s' false
            for name in ${sel//,/ }; do
              [[ "$name" == all ]] && { printf -v "$all" '%s' true; continue; }
              [[ " $* " == *" $name "* ]] || { echo "::error::unknown '$name', use all or a comma list of: $*"; exit 1; }
            done
            for name in "$@"; do
              if [[ ",$sel," == *",$name,"* ]]; then printf -v "${prefix}${name^^}" '%s' true
              else printf -v "${prefix}${name^^}" '%s' false; fi
            done
          }
          _flags "$(_sel "$APPS_INPUT")" APP_ ALL_APPS admin hotel freelance support agents rental marketing academy insurance moqui

          # All Apps = one script run with 'all' (the script picks the services).
          if [[ "$ALL_APPS" == "true" ]]; then
            SERVICES="all"
          else
            SERVICES=""
            [[ "$APP_MOQUI" == "true" ]] && SERVICES="${SERVICES}moqui "
            [[ "$APP_ADMIN" == "true" ]] && SERVICES="${SERVICES}admin "
            [[ "$APP_HOTEL" == "true" ]] && SERVICES="${SERVICES}hotel "
            [[ "$APP_FREELANCE" == "true" ]] && SERVICES="${SERVICES}freelance "
            [[ "$APP_SUPPORT" == "true" ]] && SERVICES="${SERVICES}support "
            [[ "$APP_AGENTS" == "true" ]] && SERVICES="${SERVICES}agents "
            [[ "$APP_RENTAL" == "true" ]] && SERVICES="${SERVICES}rental "
            [[ "$APP_MARKETING" == "true" ]] && SERVICES="${SERVICES}marketing "
            [[ "$APP_ACADEMY" == "true" ]] && SERVICES="${SERVICES}academy "
            [[ "$APP_INSURANCE" == "true" ]] && SERVICES="${SERVICES}insurance "
            SERVICES="${SERVICES% }"
          fi
          if [[ -z "$SERVICES" ]]; then echo "::error::at least one app is mandatory"; exit 1; fi
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

      - name: Revert last sync on growerp.com
        uses: appleboy/ssh-action@v1
        with:
          host: growerp.com
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            rc=0
            for svc in ${{ steps.services.outputs.services }}; do
              server/swarm/revert-prod.sh "$svc" --apply || rc=1
            done
            exit $rc
