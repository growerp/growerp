name: Bootstrap Apple Signing (match)

# One-time signing setup for a new vertical. The publish workflow runs match in
# readonly mode, so it can never create the first certificate/provisioning
# profile for a new bundle ID — that job fails with
# "No matching provisioning profiles found for 'AppStore_org.growerp.<app>.provisionprofile'".
#
# This workflow runs match in WRITE mode and pushes the new assets to the
# certificates repo. It is manual-only by design.
#
# Prerequisites per app (cannot be automated here):
#   - the bundle ID org.growerp.<app> exists in the Apple Developer portal
#   - the app record exists in App Store Connect
#
# Secrets: MATCH_PASSWORD, MATCH_GIT_URL, MATCH_GIT_BASIC_AUTHORIZATION,
#          APP_STORE_CONNECT_API_KEY_ID / _ISSUER_ID / _KEY_CONTENT

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps: all, or a comma list of admin,hotel,freelance,support,agents,rental,marketing,academy,insurance"
        required: true
        default: "all"
        type: string
      platform:
        description: "Which platform's signing assets to create"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - ios
          - macos
      force:
        description: "Regenerate the provisioning profile even if one already
          exists (fixes an existing profile that won't sign/export)"
        type: boolean
        default: false

concurrency:
  group: match-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: flutter/release/release_config.json
          sparse-checkout-cone-mode: false
      - id: set
        env:
          APPS_INPUT: ${{ inputs.apps }}
        run: |
          # apps / stores inputs: "all" or a comma list (e.g. admin,hotel), case and spaces ignored.
          # Sets the ALL_*/APP_*/STORE_* flags the selection below works with.
          _sel() { echo "${1:-}" | tr 'A-Z' 'a-z' | tr -d ' '; }
          _flags() {  # <selection> <prefix> <ALL_ var> <valid names...>
            local sel="$1" prefix="$2" all="$3" name; shift 3
            printf -v "$all" '%s' false
            for name in ${sel//,/ }; do
              [[ "$name" == all ]] && { printf -v "$all" '%s' true; continue; }
              [[ " $* " == *" $name "* ]] || { echo "::error::unknown '$name', use all or a comma list of: $*"; exit 1; }
            done
            for name in "$@"; do
              if [[ ",$sel," == *",$name,"* ]]; then printf -v "${prefix}${name^^}" '%s' true
              else printf -v "${prefix}${name^^}" '%s' false; fi
            done
          }
          _flags "$(_sel "$APPS_INPUT")" APP_ ALL_APPS admin hotel freelance support agents rental marketing academy insurance

          apps=()
          if [[ "$ALL_APPS" == "true" ]]; then
            # Every app that ships to an Apple store (central list: storeApps
            # in flutter/release/release_config.json).
            mapfile -t apps < <(jq -r '.storeApps | to_entries[]
              | select(.value | index("ios") or index("macos")) | .key' \
              flutter/release/release_config.json)
          else
            [[ "$APP_ADMIN"     == "true" ]] && apps+=(admin)
            [[ "$APP_HOTEL"     == "true" ]] && apps+=(hotel)
            [[ "$APP_FREELANCE" == "true" ]] && apps+=(freelance)
            [[ "$APP_SUPPORT"   == "true" ]] && apps+=(support)
            [[ "$APP_AGENTS"    == "true" ]] && apps+=(agents)
            [[ "$APP_RENTAL"    == "true" ]] && apps+=(rental)
            [[ "$APP_MARKETING" == "true" ]] && apps+=(marketing)
            [[ "$APP_ACADEMY"   == "true" ]] && apps+=(academy)
            [[ "$APP_INSURANCE" == "true" ]] && apps+=(insurance)
          fi

          if [[ ${#apps[@]} -eq 0 ]]; then
            echo "::error::at least one app is mandatory"
            exit 1
          fi

          case "${{ inputs.platform }}" in
            both)  platforms=(ios macos) ;;
            *)     platforms=("${{ inputs.platform }}") ;;
          esac

          json="["
          first=true
          for app in "${apps[@]}"; do
            for p in "${platforms[@]}"; do
              [[ "$first" == false ]] && json="${json},"
              json="${json}{\"app\":\"${app}\",\"platform\":\"${p}\"}"
              first=false
            done
          done
          json="${json}]"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "$json"

  bootstrap:
    needs: [ resolve-matrix ]
    runs-on: macos-latest
    strategy:
      # Serial: every job pushes to the same certificates repo.
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: flutter/fastlane

      - name: Fastlane match bootstrap (${{ matrix.app }} / ${{ matrix.platform }})
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/flutter/fastlane/Gemfile
          APP_NAME: ${{ matrix.app }}
          MATCH_PLATFORM: ${{ matrix.platform }}
          MATCH_FORCE: ${{ inputs.force }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane bootstrap_signing
        working-directory: flutter
