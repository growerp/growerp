name: Integration Tests

# Run headless Flutter integration tests on Linux desktop.
# Tests use Docker Compose for the Moqui backend + PostgreSQL,
# and xvfb for a virtual display.
#
# Full runs split across 4 parallel slices on separate runners, each with its own
# Moqui + PostgreSQL. Tests are self-contained — each creates its own company/admin,
# so slices don't interfere with each other.
#
# Runs daily at 1 AM Bangkok time (18:00 UTC previous day) — only if there were commits that day.
# Can also be triggered manually via workflow_dispatch.

on:
  schedule:
    # 1 AM Bangkok time (UTC+7) = 18:00 UTC previous day — only runs if there were commits that day
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      package_filter:
        description: 'Only test packages matching this string (e.g. "catalog"). Leave empty for all 4 slices.'
        required: false
        default: ""

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ------------------------------------------------------------------
  # 0. Change detection — skip scheduled runs with no recent changes
  # ------------------------------------------------------------------
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.detect.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "▶️ Integration tests running (event: ${{ github.event_name }})." >> "$GITHUB_STEP_SUMMARY"
          else
            SINCE=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%S')
            COUNT=$(git log --since="$SINCE" --oneline -- \
              'flutter/**' 'moqui/runtime/component/**' | wc -l)
            if [ "$COUNT" -gt 0 ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "$COUNT commit(s) with relevant changes found."
              echo "▶️ Integration tests running — $COUNT commit(s) with relevant changes in the last 24h." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "No relevant changes in the last 24 hours — skipping tests."
              echo "⏭️ Integration tests skipped — no relevant changes (flutter/** or moqui/runtime/component/**) in the last 24h." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  # ------------------------------------------------------------------
  # 1a. Backend Spock tests (growerp component)
  #     Boots an embedded Moqui against a freshly loaded H2 database, no
  #     docker/flutter needed. Covers currency conversion (one-page
  #     checkout) and tenant subscription renewal.
  # ------------------------------------------------------------------
  backend-tests:
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules (SSH → HTTPS rewrite)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up backend component symlinks
        run: bash setup-backend.sh

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build moqui
        working-directory: moqui
        run: |
          WRAPPER=gradle/wrapper/gradle-wrapper.properties
          # services.gradle.org regularly times out / returns 504 from CI.
          sed -i 's/^networkTimeout=.*/networkTimeout=60000/' "$WRAPPER"
          sed -i 's/^validateDistributionUrl=.*/validateDistributionUrl=false/' "$WRAPPER"
          MIRRORS=(
            'https\://services.gradle.org/distributions/gradle-9.2.0-bin.zip'
            'https\://mirrors.cloud.tencent.com/gradle/gradle-9.2.0-bin.zip'
          )
          ok=0
          for url in "${MIRRORS[@]}"; do
            sed -i "s|^distributionUrl=.*|distributionUrl=$url|" "$WRAPPER"
            for attempt in 1 2 3; do
              if ./gradlew build; then ok=1; break; fi
              echo "gradlew attempt $attempt via $url failed; retrying in 20s..."
              sleep 20
            done
            [ "$ok" = 1 ] && break
            echo "all attempts on $url failed; trying next mirror..."
          done
          [ "$ok" = 1 ] || { echo "gradlew failed on all mirrors"; exit 1; }

      - name: Load seed data (H2)
        working-directory: moqui
        run: java -jar moqui.war load types=seed,seed-initial,install no-run-es

      - name: Run growerp backend tests
        working-directory: moqui
        run: ./gradlew :runtime:component:growerp:test --console=plain

      - name: Backend test summary
        if: always()
        working-directory: moqui
        run: |
          echo "## Backend Spock Tests" >> "$GITHUB_STEP_SUMMARY"
          REPORT=runtime/component/growerp/build/test-results/test
          if ls "$REPORT"/TEST-*.xml >/dev/null 2>&1; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -h "<testcase" "$REPORT"/TEST-*.xml \
              | sed -E 's/.*name="([^"]+)".*/\1/' >> "$GITHUB_STEP_SUMMARY"
            grep -h "<testsuite " "$REPORT"/TEST-*.xml \
              | sed -E 's/.*tests="([0-9]+)" skipped="([0-9]+)" failures="([0-9]+)" errors="([0-9]+)".*/tests: \1, skipped: \2, failures: \3, errors: \4/' \
              >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test report generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: moqui/runtime/component/growerp/build/test-results/test/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------
  # 1. Integration tests
  #    Full run: 4 parallel slices, each with its own Moqui backend.
  #    Filtered run (package_filter set): single job using PACKAGE_FILTER.
  # ------------------------------------------------------------------
  integration-tests:
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # Use a single slice when package_filter is set; otherwise run all 4.
        slice: ${{ fromJSON(github.event.inputs.package_filter && '[1]' || '[1,2,3,4]') }}
        format: [mobile, desktop]

    steps:
      # ------------------------------------------------------------------
      # 1. Free disk space
      # GitHub runners ship with Android SDK, .NET, Haskell etc. that consume
      # ~15 GB we don't need. Remove them before pulling the Flutter image.
      # ------------------------------------------------------------------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo docker image prune -af
          df -h

      # ------------------------------------------------------------------
      # 2. Checkout
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules (SSH → HTTPS rewrite)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up backend component symlinks
        run: bash setup-backend.sh

      # ------------------------------------------------------------------
      # 3. Build moqui backend image from local source
      # ------------------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build moqui backend image
        run: |
          mkdir -p moqui/build
          cd moqui
          WRAPPER=gradle/wrapper/gradle-wrapper.properties
          # services.gradle.org regularly times out / returns 504 from CI.
          # Bump the wrapper timeout and fall back to a mirror when the
          # primary CDN is unavailable. validateDistributionUrl must be off
          # for the mirror since it is not on the gradle.org domain.
          sed -i 's/^networkTimeout=.*/networkTimeout=60000/' "$WRAPPER"
          sed -i 's/^validateDistributionUrl=.*/validateDistributionUrl=false/' "$WRAPPER"
          MIRRORS=(
            'https\://services.gradle.org/distributions/gradle-9.2.0-bin.zip'
            'https\://mirrors.cloud.tencent.com/gradle/gradle-9.2.0-bin.zip'
          )
          ok=0
          for url in "${MIRRORS[@]}"; do
            sed -i "s|^distributionUrl=.*|distributionUrl=$url|" "$WRAPPER"
            for attempt in 1 2 3; do
              if ./gradlew build getPostgresJdbc; then ok=1; break; fi
              echo "gradlew attempt $attempt via $url failed; retrying in 20s..."
              sleep 20
            done
            [ "$ok" = 1 ] && break
            echo "all attempts on $url failed; trying next mirror..."
          done
          [ "$ok" = 1 ] || { echo "gradlew failed on all mirrors"; exit 1; }
          cd docker/simple && bash docker-build.sh ../.. growerp/growerp-moqui eclipse-temurin:21-jdk

      # ------------------------------------------------------------------
      # 4. Build test runner image (cached via Docker layer cache)
      # ------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test runner image
        uses: docker/build-push-action@v5
        with:
          context: flutter
          file: flutter/ci/Dockerfile
          load: true
          tags: growerp/flutter-test-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------
      # 5. Start backend services
      # ------------------------------------------------------------------
      - name: Start Moqui backend
        working-directory: flutter
        run: docker compose -f ci/docker-compose-test.yml up -d moqui-database moqui

      - name: Wait for Moqui to be healthy
        working-directory: flutter
        run: |
          echo "Waiting for Moqui backend..."
          TIMEOUT=180
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            if docker compose -f ci/docker-compose-test.yml exec -T moqui \
                curl -sf http://localhost/status 2>/dev/null; then
              echo "Moqui is ready"
              break
            fi
            echo "Waiting... ($ELAPSED/$TIMEOUT seconds)"
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "ERROR: Moqui not ready after $TIMEOUT seconds"
            docker compose -f ci/docker-compose-test.yml logs moqui
            exit 1
          fi

      # ------------------------------------------------------------------
      # 6. Run integration tests
      # ------------------------------------------------------------------
      - name: Run integration tests (slice ${{ matrix.slice }} - ${{ matrix.format }})
        working-directory: flutter
        env:
          PACKAGE_FILTER: ${{ github.event.inputs.package_filter || '' }}
          # Set PACKAGE_SLICE only for full (unfiltered) runs.
          PACKAGE_SLICE: ${{ !github.event.inputs.package_filter && format('{0}/4', matrix.slice) || '' }}
          SCREEN_WIDTH: ${{ matrix.format == 'mobile' && '412' || '1280' }}
          SCREEN_HEIGHT: ${{ matrix.format == 'mobile' && '732' || '800' }}
        run: |
          PACKAGE_FILTER="$PACKAGE_FILTER" PACKAGE_SLICE="$PACKAGE_SLICE" \
            SCREEN_WIDTH="$SCREEN_WIDTH" SCREEN_HEIGHT="$SCREEN_HEIGHT" \
            docker compose -f ci/docker-compose-test.yml up \
              --exit-code-from sut sut 2>&1 | tee /tmp/test_output.log
          echo "TEST_EXIT_CODE=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 7. Per-slice results
      # ------------------------------------------------------------------
      - name: Test results summary (slice ${{ matrix.slice }} - ${{ matrix.format }})
        if: always()
        run: |
          echo "## Test Results — Slice ${{ matrix.slice }}/4 (${{ matrix.format }})" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/test_output.log ]; then
            if grep -q '=== FINAL TEST SUMMARY' /tmp/test_output.log; then
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              grep '>>> RESULT:' /tmp/test_output.log >> "$GITHUB_STEP_SUMMARY" || true
              echo "" >> "$GITHUB_STEP_SUMMARY"
              sed -n '/=== FINAL TEST SUMMARY/,$ p' /tmp/test_output.log | head -100 \
                >> "$GITHUB_STEP_SUMMARY" || true
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              # Package-filter or legacy format
              FAILED=$(grep -cE ' FAILED$|\[E\]' /tmp/test_output.log || true)
              if [ "$FAILED" = "0" ]; then
                echo "All tests passed." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "**$FAILED failure(s) detected:**" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                grep -E ' FAILED$|\[E\]' /tmp/test_output.log >> "$GITHUB_STEP_SUMMARY" || true
                echo '```' >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.slice }}-${{ matrix.format }}
          path: /tmp/test_output.log
          retention-days: 7

      # ------------------------------------------------------------------
      # 8. Cleanup
      # ------------------------------------------------------------------
      - name: Tear down Docker services
        if: always()
        working-directory: flutter
        run: docker compose -f ci/docker-compose-test.yml down -v

  # ------------------------------------------------------------------
  # 2. Combined summary across all slices
  # ------------------------------------------------------------------
  summarize:
    needs: [integration-tests, backend-tests]
    if: always() && needs.integration-tests.result != 'skipped'
    runs-on: ubuntu-latest
    # No continue-on-error here: this job enforces the failure threshold
    # ("CI FAILED: more than 1 individual test failure"), so its result must
    # reach the workflow status. A stuck run (runner-allocation hiccup) is
    # bounded by the timeout instead — re-run the job if that happens.
    timeout-minutes: 15
    steps:
      - name: Download all test logs
        uses: actions/download-artifact@v4
        with:
          pattern: test-output-*
          path: test-logs/

      - name: Download backend test results
        uses: actions/download-artifact@v4
        with:
          name: backend-test-results
          path: backend-test-logs/
        continue-on-error: true

      - name: Build Pages totals
        if: always()
        run: |
          python3 << 'PYEOF'
          import glob, os, re
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          # ── Backend Spock totals ────────────────────────────────────────
          backend_tests = backend_skipped = backend_failures = backend_errors = 0
          for xf in glob.glob('backend-test-logs/TEST-*.xml'):
              try:
                  root = ET.parse(xf).getroot()
              except ET.ParseError:
                  continue
              backend_tests    += int(root.get('tests', 0))
              backend_skipped  += int(root.get('skipped', 0))
              backend_failures += int(root.get('failures', 0))
              backend_errors   += int(root.get('errors', 0))
          backend_passed = backend_tests - backend_skipped - backend_failures - backend_errors
          backend_failed = backend_failures + backend_errors

          # ── Flutter totals per format (mirrors the Combined summary step) ─
          def last_trailing_number(text, keyword):
              val = None
              for line in text.splitlines():
                  if keyword in line:
                      after = line.split('|', 1)[-1] if '|' in line else line
                      m = re.search(r'(\d+)\s*$', after)
                      if m:
                          val = int(m.group(1))
              return val or 0

          def format_totals(fmt):
              passed_pkgs = failed_pkgs = ind_passed = ind_failed = 0
              for slice_dir in sorted(glob.glob(f'test-logs/test-output-*-{fmt}')):
                  log = os.path.join(slice_dir, 'test_output.log')
                  if not os.path.exists(log):
                      continue
                  text = open(log, errors='replace').read()
                  lines = '\n'.join(l for l in text.splitlines() if '+ echo' not in l)
                  failed_pkgs += len(re.findall(r'>>> RESULT:.*FAILED', lines))
                  passed_pkgs += len(re.findall(r'>>> RESULT:.*PASSED', lines))
                  ind_passed  += last_trailing_number(text, 'Tests passed')
                  ind_failed  += last_trailing_number(text, 'Tests failed')
              return passed_pkgs, failed_pkgs, ind_passed, ind_failed

          mobile  = format_totals('mobile')
          desktop = format_totals('desktop')

          rows = [
              ('Backend (Spock) tests',      backend_passed, backend_failed),
              ('Flutter Mobile packages',    mobile[0],      mobile[1]),
              ('Flutter Mobile tests',       mobile[2],      mobile[3]),
              ('Flutter Desktop packages',   desktop[0],     desktop[1]),
              ('Flutter Desktop tests',      desktop[2],     desktop[3]),
          ]
          table_rows = ''.join(
              f'<tr><td>{name}</td><td>{p}</td><td>{f}</td></tr>' for name, p, f in rows
          )
          css = '\n'.join([
              '  body  { font-family: Arial, sans-serif; font-size: 12pt; margin: 2cm; color: #222; }',
              '  h1    { color: #1a5276; border-bottom: 2px solid #1a5276; padding-bottom: 6px; }',
              '  table { border-collapse: collapse; margin-top: 1em; }',
              '  th    { background: #1a5276; color: #fff; padding: 7px 12px; text-align: center; }',
              '  td    { border: 1px solid #ccc; padding: 6px 10px; }',
              '  tr:nth-child(even) td { background: #f4f6f9; }',
              '  td:first-child { font-weight: bold; }',
          ])
          now_str = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          full_html = (
              '<!DOCTYPE html><html><head><meta charset="utf-8">'
              f'<style>\n{css}\n</style></head><body>'
              '<h1>Integration Test Results</h1>'
              '<p><a href="index.html">&larr; Store Status</a></p>'
              f'<p>Generated: {now_str}</p>'
              '<table><tr><th>Suite</th><th>Passed</th><th>Failed</th></tr>'
              f'{table_rows}</table>'
              '</body></html>'
          )
          os.makedirs('/tmp/pages', exist_ok=True)
          with open('/tmp/pages/tests.html', 'w') as f:
              f.write(full_html)
          print('tests.html written.')
          PYEOF

      - name: Preserve store status report page
        if: always()
        run: curl -sf https://growerp.github.io/growerp/ -o /tmp/pages/index.html || echo "no index.html yet"

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages

      - name: Combined summary
        env:
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
        run: |
          FAIL_FILE=$(mktemp)
          echo "0" > "$FAIL_FILE"
          if [ "$BACKEND_RESULT" = "failure" ]; then
            echo "1" > "$FAIL_FILE"
          fi

          {
          echo "## Backend Spock Tests"
          echo '```'
          if ls backend-test-logs/TEST-*.xml >/dev/null 2>&1; then
            grep -h "<testsuite " backend-test-logs/TEST-*.xml \
              | sed -E 's/.*tests="([0-9]+)" skipped="([0-9]+)" failures="([0-9]+)" errors="([0-9]+)".*/tests: \1, skipped: \2, failures: \3, errors: \4/'
          else
            echo "No backend test report found (job result: ${BACKEND_RESULT})"
          fi
          echo '```'
          echo ""

          echo "## Overall Test Results"

          for FORMAT in mobile desktop; do
            DISPLAY_FORMAT="Mobile"
            if [ "$FORMAT" = "desktop" ]; then
              DISPLAY_FORMAT="Desktop"
            fi
            echo "### $DISPLAY_FORMAT Layout Results"
            echo '```'

            FAILED_PKGS=0
            PASSED_PKGS=0
            IND_PASSED=0
            IND_FAILED=0

            for slice_dir in $(ls -d test-logs/test-output-*-${FORMAT} 2>/dev/null | sort -V); do
              SLICE_NAME=$(basename "$slice_dir" | sed 's/test-output-//')
              LOG="$slice_dir/test_output.log"
              if [ -f "$LOG" ]; then
                echo "--- Slice $SLICE_NAME ---"
                grep '>>> RESULT:' "$LOG" | grep -v '+ echo' | sed 's/^[^|]*| *//' \
                  || echo "  (no structured results)"
                FAILED=$(grep '>>> RESULT:.*FAILED' "$LOG" | grep -v '+ echo' | wc -l)
                PASSED=$(grep '>>> RESULT:.*PASSED' "$LOG" | grep -v '+ echo' | wc -l)
                FAILED_PKGS=$((FAILED_PKGS + FAILED))
                PASSED_PKGS=$((PASSED_PKGS + PASSED))

                # Extract individual test counts
                P_COUNT=$(grep 'Tests passed' "$LOG" | sed 's/^[^|]*| *//' | grep -oE '[0-9]+$' | tail -1)
                F_COUNT=$(grep 'Tests failed' "$LOG" | sed 's/^[^|]*| *//' | grep -oE '[0-9]+$' | tail -1)
                IND_PASSED=$((IND_PASSED + ${P_COUNT:-0}))
                IND_FAILED=$((IND_FAILED + ${F_COUNT:-0}))
              fi
            done

            echo ""
            echo "Packages passed : $PASSED_PKGS"
            echo "Packages failed : $FAILED_PKGS"
            echo "Tests passed    : $IND_PASSED"
            echo "Tests failed    : $IND_FAILED"

            if [ "$IND_FAILED" -gt 1 ]; then
              echo "1" > "$FAIL_FILE"
            fi

            if [ "$FAILED_PKGS" -eq 0 ]; then
              echo ""
              echo "All packages passed for $DISPLAY_FORMAT layout!"
            else
              echo ""
              echo "Failed tests ($DISPLAY_FORMAT):"
              {
                for slice_dir in $(ls -d test-logs/test-output-*-${FORMAT} 2>/dev/null | sort -V); do
                  LOG="$slice_dir/test_output.log"
                  [ -f "$LOG" ] && sed 's/^[^|]*| *//' "$LOG" | grep -E '^\[[^]]+\] ' || true
                done
              } | sort -u
            fi
            echo '```'
            echo ""
          done

          echo "## Flutter Exceptions Report"
          HAS_EXCEPTIONS=0
          for FORMAT in mobile desktop; do
            DISPLAY_FORMAT="Mobile"
            if [ "$FORMAT" = "desktop" ]; then
              DISPLAY_FORMAT="Desktop"
            fi
            FORMAT_HEADER_PRINTED=0
            for slice_dir in $(ls -d test-logs/test-output-*-${FORMAT} 2>/dev/null | sort -V); do
              SLICE_NAME=$(basename "$slice_dir" | sed 's/test-output-//')
              LOG="$slice_dir/test_output.log"
              if [ -f "$LOG" ]; then
                EXCEPTIONS=$(sed 's/^[^|]*| *//' "$LOG" | awk '/══╡ EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK ╞═════/,/═════════════════════════════════════════════════/ && !/EXCEPTION/' || true)
                if [ -n "$EXCEPTIONS" ]; then
                  HAS_EXCEPTIONS=1
                  if [ "$FORMAT_HEADER_PRINTED" -eq 0 ]; then
                    echo "### $DISPLAY_FORMAT Layout Exceptions"
                    FORMAT_HEADER_PRINTED=1
                  fi
                  echo "#### Exceptions in Slice: $SLICE_NAME"
                  echo '```'
                  echo "$EXCEPTIONS"
                  echo '```'
                  echo ""
                fi
              fi
            done
          done

          if [ "$HAS_EXCEPTIONS" -eq 0 ]; then
            echo "No Flutter exceptions caught by the test framework."
          fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$(cat "$FAIL_FILE")" = "1" ]; then
            echo "CI FAILED: more than 1 individual test failure for at least one platform." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ------------------------------------------------------------------
  # Publish integration test totals to GitHub Pages (deploys even when
  # `summarize` fails its threshold check — that's exactly when people
  # want to see the totals).
  # ------------------------------------------------------------------
  deploy-pages:
    needs: summarize
    if: always() && needs.summarize.result != 'skipped'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

