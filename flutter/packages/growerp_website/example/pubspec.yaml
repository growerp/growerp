name: website_example
resolution: workspace
description: A example project.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: '>=3.33.0'

dependencies:
  flutter:
    sdk: flutter
  growerp_website: ^1.11.0
  growerp_core: ^1.11.0
  growerp_models: ^1.12.0
  global_configuration: ^2.0.0
  flutter_bloc: ^9.1.1
  go_router: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/cfg/
    - ./
    - packages/growerp_core/images/growerp.jpg
    - packages/growerp_core/images/growerpDark100.png
