name: growerp_adk
resolution: workspace
description: "GrowERP ADK domain: AI agents, agent config, scheduled jobs, agent chat and governance (action audit + write approvals)."
version: 1.2.0
repository: https://github.com/growerp/growerp
homepage: https://www.growerp.com
environment:
  sdk: ^3.10.0
  flutter: '>=3.33.0'

dependencies:
  flutter:
    sdk: flutter
  growerp_core: ^1.12.0
  growerp_models: ^1.13.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  responsive_framework: ^1.5.1
  global_configuration: ^2.0.0
  about: ^2.2.0
  dio: ^5.11.1
  go_router: ^17.5.0
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.2
  file_picker: ^13.1.0
  flutter_test:
    sdk: flutter
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.31.1

flutter:
  uses-material-design: true
  generate: true
