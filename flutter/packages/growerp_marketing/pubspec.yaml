name: growerp_marketing
resolution: workspace
description: Assessment and lead scoring module for GrowERP
version: 1.9.0
publish_to: "none"

environment:
  sdk: ^3.10.0
  flutter: '>=3.33.0'

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter

  # Core packages (dependency on growerp ecosystem)
  growerp_models: ^1.13.0
  growerp_core: ^1.12.0

  # JSON serialization
  json_annotation: ^4.12.0

  # HTTP client for API calls
  retrofit: ^4.10.0
  dio: ^5.11.1
  logger: ^2.8.0

  # State management & utilities
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  intl: ^0.20.3

  # Web support

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing & analysis
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true
