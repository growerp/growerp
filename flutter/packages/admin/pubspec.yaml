name: admin
resolution: workspace
description: "Run inventory, sales, purchasing, HR and accounting from one open app."
version: 1.19.12+135
repository: https://github.com/growerp/growerp
homepage: https://www.growerp.com
publish_to: none
environment:
  sdk: ^3.10.0
  flutter: '>=3.33.0'
dependencies:
  flutter:
    sdk: flutter
  growerp_sales: ^1.12.0
  growerp_marketing: ^1.9.0
  growerp_website: ^1.12.0
  growerp_wiki: ^1.9.0
  growerp_inventory: ^1.12.0
  growerp_catalog: ^1.12.0
  growerp_manufacturing: ^1.2.0
  growerp_manuf_liner: ^1.2.0
  growerp_demos: ^1.2.0
  growerp_order_accounting: ^1.12.0
  growerp_user_company: ^1.12.0
  growerp_activity: ^1.12.0
  growerp_hr: ^1.0.0
  growerp_adk: ^1.2.0
  growerp_core: ^1.12.0
  growerp_models: ^1.13.0
  decimal: ^3.2.6
  flutter_localizations:
    sdk: flutter
  global_configuration: ^2.0.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  universal_io: ^2.3.1
  cupertino_icons: ^1.0.9
  web: ^1.1.1
  flutter_bloc: ^9.1.1
  dio: ^5.11.1
  http: ^1.6.0
  fl_chart: ^1.2.0
  get_it: ^9.3.0
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  file_picker: ^13.1.0
  go_router: ^17.5.0
  growerp_outreach: ^1.9.0
  growerp_courses: ^1.11.0
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  webdriver: ^3.2.0
  test: ^1.31.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.18.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

msix_config:
  display_name: GrowERP
  description: "Run inventory, sales, purchasing, HR and accounting from one open app."
  publisher: CN=68EEF479-7015-49FC-9C60-33E5A2EB731C
  publisher_display_name: "AntWebsystems Co.,Ltd"
  identity_name: AntWebsystemsCo.LTD.GrowERP
  msix_version: 1.16.16.0
  logo_path: "assets/icon/icon.png"
  capabilities: internetClient
  store: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/cfg/
    - packages/growerp_core/images/growerp.png
    - packages/growerp_core/images/growerp.jpg
    - packages/growerp_core/images/growerpDark.jpg
    - packages/growerp_core/images/growerp100.png
    - packages/growerp_core/images/growerpDark100.png
flutter_intl:
  enabled: true
