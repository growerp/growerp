name: hotel
resolution: workspace
description: "Manage rooms, reservations, check-in and guest billing in one app."
version: 1.19.12+81
repository: https://github.com/growerp/growerp
homepage: https://www.growerp.com
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: '>=3.33.0'

dependencies:
  flutter:
    sdk: flutter
  growerp_adk: ^1.1.1
  growerp_core: ^1.11.1
  growerp_sales: ^1.11.1
  growerp_website: ^1.11.1
  growerp_inventory: ^1.11.1
  growerp_catalog: ^1.11.1
  growerp_order_accounting: ^1.11.1
  growerp_rental: ^1.1.1
  growerp_user_company: ^1.11.1
  growerp_activity: ^1.11.1
  package_info_plus: ^10.2.2
  horizontal_data_table: ^4.3.4
  flutter_localizations:
    sdk: flutter
  universal_io: ^2.3.1
  intl: ^0.20.3
  decimal: ^3.2.6
  fl_chart: ^1.2.0
  go_router: ^17.5.0
  dio: ^5.11.1
  web: ^1.1.1
  flutter_bloc: ^9.1.1
  growerp_models: ^1.12.2
  shared_preferences: ^2.5.6
  global_configuration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  mockito: ^5.8.1
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.18.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

msix_config:
  display_name: GrowERP-Hotel
  description: "Manage rooms, reservations, check-in and guest billing in one app."
  publisher: CN=68EEF479-7015-49FC-9C60-33E5A2EB731C
  publisher_display_name: "AntWebsystems Co.,Ltd"
  identity_name: AntWebsystemsCo.LTD.GrowERP-Hotel
  msix_version: 1.16.17.0
  logo_path: "assets/icon/icon.png"
  capabilities: internetClient
  store: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/cfg/
    - packages/growerp_core/images/growerp100.png
    - packages/growerp_core/images/growerpDark100.png
    - packages/growerp_core/images/growerp.jpg
    - packages/growerp_core/images/growerpDark.jpg

flutter_intl:
  enabled: true
