name: growerp_models
resolution: workspace
version: 1.13.0
description: Freezed data models and a Retrofit REST client for the GrowERP Moqui backend, shared across all GrowERP Flutter packages.
homepage: https://www.growerp.com
repository: https://github.com/growerp/growerp
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.10.0

dependencies:
  decimal: ^3.2.6
  equatable: ^2.1.0
  freezed_annotation: ^3.1.0
  dio: ^5.11.1
  retrofit: ^4.10.0
  pretty_dio_logger: ^1.4.0
  fast_csv: ^0.2.11
  logger: ^2.8.0
  universal_io: ^2.3.1
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  freezed: ^4.0.1
  retrofit_generator: ^10.2.11
