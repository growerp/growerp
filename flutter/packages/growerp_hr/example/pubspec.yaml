name: growerp_hr_example
resolution: workspace
version: 0.0.1+1
repository: https://github.com/growerp/growerp
homepage: https://www.growerp.com
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: '>=3.33.0'

dependencies:
  flutter:
    sdk: flutter
  growerp_hr: ^1.0.0
  growerp_core: ^1.11.0
  growerp_models: ^1.12.0
  growerp_user_company: ^1.11.0
  flutter_bloc: ^9.1.1
  go_router: ^17.1.0
  flutter_localizations:
    sdk: flutter
  global_configuration: ^2.0.0
  intl: ^0.20.2
  decimal: ^3.2.4
  shared_preferences: ^2.3.2
  package_info_plus: ^10.2.1
  path_provider: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  test: ^1.19.5
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/cfg/
    - packages/growerp_core/images/growerp.png
    - packages/growerp_core/images/growerp.jpg
    - packages/growerp_core/images/growerpDark.jpg
    - packages/growerp_core/images/growerp100.png
    - packages/growerp_core/images/growerpDark100.png
