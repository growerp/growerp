name: growerp_core
resolution: workspace
description: "Core building block for the GrowERP frontend: authentication, theming, navigation, and shared widgets used by every GrowERP Flutter package and app."
version: 1.11.1
homepage: https://www.growerp.com
repository: https://github.com/growerp/growerp
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
environment:
  sdk: ^3.10.0
  flutter: '>=3.33.0'
dependencies:
  growerp_models: ^1.12.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  decimal: ^3.2.6
  intl: ^0.20.3
  global_configuration: ^2.0.0
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  meta: ^1.19.0
  image_picker: ^1.2.4
  responsive_framework: ^1.5.1
  flutter_simple_treeview: ^3.0.2
  printing: ^5.14.3
  pdf: ^3.12.0
  about: ^2.2.0
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.6
  stream_transform: ^2.1.2
  collection: ^1.19.1
  dio: ^5.11.1
  credit_card_validator: ^2.1.0
  credit_card_type_detector: ^3.0.0
  markdown_widget: ^2.3.2+8
  url_launcher: ^6.3.3
  flutter_colorpicker: ^1.1.0
  from_css_color: ^2.0.0
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  fast_csv: ^0.2.11
  archive: ^3.6.1
  image: ^4.3.0
  flutter_staggered_grid_view: ^0.7.0
  retrofit: ^4.10.0
  logger: ^2.8.0
  http: ^1.6.0
  pretty_dio_logger: ^1.4.0
  dio_cache_interceptor: ^4.0.7
  universal_io: ^2.3.1
  flex_color_scheme: ^8.4.0
  go_router: ^17.5.0
  app_links: ^7.2.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  growerp_activity: ^1.11.1
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  google_fonts: ^8.2.1
  animations: ^2.2.0
  web: ^1.1.1
  flutter_widget_from_html_core: ^0.17.4
dev_dependencies:
  flutter_driver:
    sdk: flutter
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.11
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Outfit
      fonts:
        - asset: fonts/Outfit-Regular.ttf
flutter_intl:
  enabled: true
