version: 1.1.1
homepage: https://www.growerp.com
repository: https://github.com/growerp/growerp
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
environment:
  sdk: ^3.10.0
  flutter: '>=3.33.0'

dependencies:
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
  growerp_core: ^1.11.1
  growerp_models: ^1.12.2
  growerp_catalog: ^1.11.1
  growerp_manufacturing: ^1.1.1
  growerp_manuf_liner: ^1.1.1
  growerp_order_accounting: ^1.11.1
  decimal: ^3.2.6
  dio: ^5.11.1
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.6

flutter:
  uses-material-design: true
  generate: true
