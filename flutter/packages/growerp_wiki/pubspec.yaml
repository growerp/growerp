name: growerp_wiki
resolution: workspace
description: GrowERP wiki building block - browse and edit the OKF knowledge bundle and company wiki pages from the Flutter frontend.
version: 1.9.0
homepage: https://www.growerp.com
repository: https://github.com/growerp/growerp

environment:
  sdk: ^3.10.0
  flutter: '>=3.33.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core packages (dependency on growerp ecosystem)
  growerp_models: ^1.13.0
  growerp_core: ^1.12.0

  # State management & utilities
  flutter_bloc: ^9.1.1

  # Markdown rendering (same version as growerp_core)
  markdown_widget: ^2.3.2+8

  # test helper class in lib/src/integration_test is part of the public API
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
