name: academy
resolution: workspace
version: 1.19.12+5
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ^3.33.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  growerp_core: ^1.11.0
  growerp_models: ^1.12.0
  growerp_user_company: ^1.11.0
  growerp_courses: ^1.10.0
  universal_io: ^2.2.2
  global_configuration: ^2.0.0
  responsive_framework: ^1.4.0
  bloc_concurrency: ^0.3.0
  package_info_plus: ^10.2.1
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  hive_flutter: ^1.1.0
  go_router: ^17.1.0
  dio: ^5.4.3
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.16.12

# to run icons: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/cfg/
    - packages/growerp_core/images/growerp.png
    - packages/growerp_core/images/growerp.jpg
    - packages/growerp_core/images/growerpDark.jpg
    - packages/growerp_core/images/growerp100.png
    - packages/growerp_core/images/growerpDark100.png
flutter_intl:
  enabled: true

msix_config:
  display_name: GrowERP-Academy
  description: "Follow online courses with an AI tutor, exercises and progress tracking."
  publisher: CN=68EEF479-7015-49FC-9C60-33E5A2EB731C
  publisher_display_name: "AntWebsystems Co.,Ltd"
  identity_name: AntWebsystemsCo.LTD.growerp-academy
  msix_version: 1.16.29.0
  logo_path: "assets/icon/icon.png"
  capabilities: internetClient
  store: true
