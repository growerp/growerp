name: support
resolution: workspace
description: System support app, for the GrowERP system
version: 1.19.12+27
repository: https://github.com/growerp/growerp
homepage: https://www.growerp.com
publish_to: none
environment:
  sdk: ^3.10.0
  flutter: '>=3.33.0'

dependencies:
  flutter:
    sdk: flutter
  growerp_user_company: ^1.11.1
  growerp_activity: ^1.11.1
  growerp_adk: ^1.1.1
  growerp_core: ^1.11.1
  growerp_models: ^1.12.2
  flutter_localizations:
    sdk: flutter
  global_configuration: ^2.0.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  universal_io: ^2.3.1
  file_picker: ^13.1.0
  cupertino_icons: ^1.0.9
  flutter_bloc: ^9.1.1
  dio: ^5.11.1
  http: ^1.6.0
  bloc_concurrency: ^0.3.0
  equatable: ^2.1.0
  stream_transform: ^2.1.2
  go_router: ^17.5.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  webdriver: ^3.2.0
  test: ^1.31.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/cfg/
    - packages/growerp_core/images/growerp.png
    - packages/growerp_core/images/growerp.jpg
    - packages/growerp_core/images/growerpDark.jpg
    - packages/growerp_core/images/growerp100.png
    - packages/growerp_core/images/growerpDark100.png
flutter_intl:
  enabled: true
