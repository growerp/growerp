name: growerp_catalog
resolution: workspace
description: >
  A catalog component for the Growerp ERP System containing, products, categories and assets
version: 1.12.0
homepage: https://www.growerp.com
repository: https://github.com/growerp/growerp
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
environment:
  sdk: ^3.10.0
  flutter: '>=3.33.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  growerp_core: ^1.12.0
  growerp_models: ^1.13.0
  intl: ^0.20.3
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  responsive_framework: ^1.5.1
  archive: ^3.6.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  flutter_colorpicker: ^1.1.0
  from_css_color: ^2.0.0
  bloc_concurrency: ^0.3.0
  image_picker: ^1.2.4
  global_configuration: ^2.0.0
  file_picker: ^13.1.0
  stream_transform: ^2.1.2
  decimal: ^3.2.6
  fast_csv: ^0.2.11
  universal_io: ^2.3.1

  dio: ^5.11.1
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  fl_chart: ^1.2.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.31.1
flutter:
  uses-material-design: true
  generate: true

  assets:
    - packages/growerp_core/images/growerp.png
    - packages/growerp_core/images/growerpDark100.png
    - packages/growerp_core/images/growerp100.png
    - packages/growerp_core/images/growerp.jpg
    - packages/growerp_core/images/growerpDark.jpg
